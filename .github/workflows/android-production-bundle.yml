name: Android production JS bundle

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-production-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked Expo dependencies
        working-directory: mobile
        run: npm ci
      - name: Validate TypeScript and lint
        working-directory: mobile
        run: |
          npm run tsc
          npm run lint
      - name: Export production Android JS and bundled assets
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-ci-android
      - name: Assert actual native-platform JS bundle and assets exist
        working-directory: mobile
        run: node scripts/check-release-export.mjs dist-ci-android
