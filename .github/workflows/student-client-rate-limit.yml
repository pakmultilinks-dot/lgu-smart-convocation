name: Student API per-client rate limit

on:
  pull_request:
    paths:
      - 'app/web/student_routes.py'
      - 'app/tests/test_student_client_rate_limit.py'
      - '.github/workflows/student-client-rate-limit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify client isolation without database access
        working-directory: app
        env:
          LGU_TESTING: '1'
          LGU_APP_ENV: test
          LGU_ALLOW_DEMO_SECRETS: '1'
        run: python -m unittest discover -s tests -p test_student_client_rate_limit.py -v
