name: Atomic gate admission

on:
  pull_request:
    paths:
      - "app/models.py"
      - "app/web/routes.py"
      - "app/tests/test_atomic_scan_admission.py"
      - ".github/workflows/atomic-scan-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m compileall -q app
      - name: Check concurrent QR check-ins on isolated SQLite
        run: python -m unittest discover -s app/tests -p 'test_atomic_scan_admission.py' -v
