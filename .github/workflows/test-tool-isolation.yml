name: Phase 39 test-tool isolation

on:
  pull_request:
    paths:
      - "app/web/routes.py"
      - "app/tests/test_test_tool_access.py"
      - "mobile/scripts/release-safety-test.mjs"
      - ".github/workflows/test-tool-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m compileall -q app
      - name: Verify test tools reject non-test deployments without SQLite access
        run: python -m unittest discover -s app/tests -p 'test_test_tool_access.py' -v
      - name: Verify mobile release-safety contract against isolated server
        run: node mobile/scripts/release-safety-test.mjs
