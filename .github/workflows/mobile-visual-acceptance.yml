name: Mobile visual acceptance
on:
  push:
    branches: ["feat/mobile-experience-redesign-*"]
    paths: ["mobile/**", ".github/workflows/mobile-visual-acceptance.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-visual-acceptance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: npm ci
        working-directory: mobile
      - run: python mobile/scripts/visual_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-ui-evidence
          path: mobile/visual-evidence/
          retention-days: 7
