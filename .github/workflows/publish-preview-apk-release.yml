name: Publish verified LGU Convocation Android download

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android preview APK workflow run
        required: true
        default: "39988318170"
      build_commit:
        description: Exact application source commit of that run
        required: true
        default: "34ebdea0ffbea3a6a6b32e587ba388e356d5b0b2"
      apk_sha256:
        description: APK SHA-256 recorded by that successful build
        required: true
        default: "43a615d1e63e7ab540e7de991906090782446d9e14a9154d1c09bf7f5b8d12aa"
      release_tag:
        description: New prerelease tag
        required: true
        default: "lgu-convocation-android-20261024"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      BUILD_COMMIT: ${{ inputs.build_commit }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Verify build provenance and download exact artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^lgu-convocation-android-[A-Za-z0-9.-]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_COMMIT" '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/android-preview-apk.yml"' run.json
          gh run download "$BUILD_RUN" -n LGU-Smart-Convocation-Preview-APK -D artifact
          echo "$APK_SHA256  artifact/LGU-Smart-Convocation-Preview.apk" | sha256sum -c -
      - name: Verify signature and isolated application package
        shell: bash
        run: |
          set -euo pipefail
          apk=artifact/LGU-Smart-Convocation-Preview.apk
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          signer=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          aapt=$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$signer" verify --verbose "$apk"
          "$aapt" dump badging "$apk" > badging.txt
          grep -F "name='pk.edu.lgu.smartconvocation.preview'" badging.txt
          grep -F "application-label:'LGU Convocation'" badging.txt
          cp "$apk" LGU-Convocation-Android.apk
          sha256sum LGU-Convocation-Android.apk > SHA256SUMS.txt
      - name: Publish direct installable download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          cat > notes.md <<EOF
          Installable LGU Convocation Android APK. Includes the student-first landing, independent administrator switches for Volunteer Operations and Live Dashboard, and connection recovery. Student Portal stays enabled.

          Application source: $BUILD_COMMIT. Verified build: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN. APK SHA-256: $APK_SHA256.

          This is a test-signed prerelease with an isolated Android package. In Connect to server, supply your reachable HTTPS LGU backend, then sign in with accounts provisioned on that backend. No server address or credentials are bundled. Real student signup and password recovery require configured SMTP. Downloading the APK does not provision a hosted backend. Physical camera, offline field sync and event-day acceptance remain to be completed; this is not production certification.
          EOF
          gh release create "$RELEASE_TAG" LGU-Convocation-Android.apk SHA256SUMS.txt \
            --target "$BUILD_COMMIT" --title "LGU Convocation Android — 24 October 2026" \
            --notes-file notes.md --prerelease
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].url'
