name: Production secret configuration

on:
  pull_request:
    paths:
      - "app/config.py"
      - "app/web/routes.py"
      - "app/run.py"
      - "app/tests/test_production_secrets.py"
      - ".github/workflows/production-secret-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m compileall -q app
      - name: Check fail-closed app startup without touching real database
        run: python -m unittest discover -s app/tests -p 'test_production_secrets.py' -v
