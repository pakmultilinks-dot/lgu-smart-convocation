name: Production startup schema gate

on:
  pull_request:
    paths:
      - "app/run.py"
      - "app/startup_schema.py"
      - "app/tests/test_startup_schema_gate.py"
      - "docs/RELEASE_CANDIDATE_RUNBOOK.md"
      - ".github/workflows/production-startup-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-schema-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m compileall -q app
      - name: Run disposable-only schema guard tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s app/tests -p "test_startup_schema_gate.py" -v
