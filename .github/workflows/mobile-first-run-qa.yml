name: First-run setup and Expo preview config

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-first-run-qa.yml"
      - "docs/MOBILE_EXPO_BUILD_AND_TEST.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked packages
        working-directory: mobile
        run: npm ci
      - name: Check first-run UX and EAS profile
        working-directory: mobile
        run: |
          node scripts/first-run-connect-test.mjs
          node scripts/configured-backend-test.mjs
      - name: Verify EAS preview package identity without Expo credentials
        working-directory: mobile
        env:
          APP_VARIANT: preview
        run: |
          npx expo config --json > preview-config.json
          node -e 'let a=require("./preview-config.json"); if(a.android.package!=="pk.edu.lgu.smartconvocation.preview" || a.android.usesCleartextTraffic!==false) process.exit(1); console.log("PASS: isolated HTTPS-only preview package");'
      - name: TypeScript and lint
        working-directory: mobile
        run: |
          npm run tsc
          npm run lint
