name: Synthetic mobile preview accounts

on:
  pull_request:
    paths:
      - "app/scripts/create_preview_demo.py"
      - "app/tests/test_preview_demo_accounts.py"
      - ".github/workflows/preview-demo-accounts.yml"
      - "docs/MOBILE_THREE_ROLE_PREVIEW.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-demo-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - name: Verify disposable-only student, scanner, admin setup
        run: python -m unittest discover -s app/tests -p 'test_preview_demo_accounts.py' -v
