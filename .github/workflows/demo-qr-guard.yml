name: Demo QR access guard

on:
  pull_request:
    paths:
      - "app/web/routes.py"
      - "app/web/templates/scanner.html"
      - "app/tests/test_demo_qr_access.py"
      - "app/tests/isolated_api_smoke_server.py"
      - "mobile/scripts/api-test.mjs"
      - ".github/workflows/demo-qr-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-qr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Compile Python backend
        run: python -m compileall -q app
      - name: Verify demo QR opt-in and production deny
        run: python -m unittest discover -s app/tests -p 'test_demo_qr_access.py' -v
      - name: Verify native administrator record management
        run: python -m unittest discover -s app/tests -p test_native_admin_records.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Node API test syntax
        run: node --check mobile/scripts/api-test.mjs
      - name: Smoke test scanner and guest workflows with the isolated harness
        env:
          LGU_TESTING: "1"
          LGU_ALLOW_DEMO_SECRETS: "1"
          LGU_APP_ENV: development
          LGU_ENABLE_DEMO_QR: "1"
        run: node mobile/scripts/api-test.mjs
