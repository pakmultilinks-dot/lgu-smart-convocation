name: Student API per-IP rate limiting

on:
  pull_request:
    paths:
      - "app/web/student_routes.py"
      - "app/scripts/test_student_rate_limit_per_ip.py"
      - ".github/workflows/student-rate-limit-per-ip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-ip-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - name: Student API rate-limit isolation (no database opened)
        run: python app/scripts/test_student_rate_limit_per_ip.py
