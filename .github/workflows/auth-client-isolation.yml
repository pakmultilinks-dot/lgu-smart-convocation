name: Authentication JSON and client isolation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-client-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m unittest discover -s app/tests -p test_auth_shapes_and_rate_isolation.py -v
