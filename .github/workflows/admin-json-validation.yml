name: Administrative JSON API input checks

on:
  pull_request:
    paths:
      - "app/web/routes.py"
      - "app/tests/test_admin_json_validation.py"
      - ".github/workflows/admin-json-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt
      - run: python -m compileall -q app
      - name: Test malformed JSON and data preservation with temporary SQLite
        run: python -m unittest discover -s app/tests -p 'test_admin_json_validation.py' -v
