name: Backend request boundary

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/upload-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Test upload boundaries
        run: python -m unittest discover -s app/tests -p 'test_upload_boundary.py' -v
