{% extends "base.html" %}
{% block title %}Unlock · {{ super() }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 32px auto;">
  <div class="page-title" style="margin-bottom: 4px;">Admin unlock</div>
  <p class="page-sub">Enter the administrator PIN to manage this server.</p>
  {% if error %}<p class="notice bad" style="margin: 10px 0;">{{ error }}</p>{% endif %}
  <form method="post" action="{{ next_url }}">
    <label>Administrator PIN
      <input type="password" name="admin_pin" inputmode="numeric" autofocus required>
    </label>
    <button class="btn green" type="submit">Unlock</button>
  </form>
</div>
{% endblock %}
