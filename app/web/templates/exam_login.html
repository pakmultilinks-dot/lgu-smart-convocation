{% extends "base.html" %}
{% block title %}Examination Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 32px auto;">
  <div class="page-title" style="margin-bottom: 4px;">Examination Department</div>
  <p class="page-sub">Staff sign-in. Accounts are issued by the administrator.</p>
  {% if error %}<p class="notice bad" style="margin: 10px 0;">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('exam.login') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ exam_csrf_token() }}">
    <label>Username
      <input type="text" name="username" maxlength="64" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" maxlength="256" required>
    </label>
    <button class="btn green" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
